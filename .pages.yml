# Pages CMS (https://pagescms.org) — 5K.STUDIO 홈페이지 관리자 화면 설정
media:
  input: media
  output: media
content:
  - name: site
    label: 홈페이지 문구·작품
    type: file
    path: content/site.json
    format: json
    fields:
      - name: meta
        label: 기본 정보 (검색·공유 미리보기)
        type: object
        fields:
          - { name: title, label: 사이트 제목, type: string }
          - { name: description, label: 사이트 설명, type: text }
          - { name: email, label: 문의 이메일, type: string }
      - name: nav
        label: 상단 메뉴
        type: object
        fields:
          - name: items
            label: 메뉴 (왼쪽부터)
            type: object
            list: true
            fields:
              - { name: label, label: 메뉴 이름, type: string }
              - name: target
                label: 누르면 이동할 곳
                type: select
                options:
                  values: [top, statement, what, approach, featured, cases, cta, vision, steps, clients, contact]
      - name: layout
        label: 섹션 순서·숨기기
        type: object
        fields:
          - name: sections
            label: 섹션 (위에서부터 순서)
            type: object
            list: true
            fields:
              - name: id
                label: 섹션
                type: select
                options:
                  values: [statement, what, approach, featured, cases, cta, vision, steps, clients]
              - { name: hidden, label: 숨기기, type: boolean }
      - name: hero
        label: 메인 화면
        type: object
        fields:
          - { name: wordmark, label: 큰 로고 문구, type: string }
          - { name: line1, label: 로고 아래 1줄, type: string }
          - { name: line2, label: 로고 아래 2줄, type: string }
          - { name: line3, label: 로고 아래 3줄, type: string }
          - { name: now_label, label: 재생 표시 문구, type: string }
          - { name: card_text, label: 소개서 카드 문구, type: text }
          - { name: card_button, label: 소개서 버튼, type: string }
          - name: slides
            label: 메인 영상 (위에서부터 순서대로 재생)
            type: object
            list: true
            fields:
              - { name: client, label: 클라이언트, type: string }
              - { name: title, label: 작품명, type: string }
              - { name: video, label: 영상 (가로형 mp4, 10MB 이하 권장), type: file }
              - { name: poster, label: 썸네일 이미지, type: image }
      - name: statement
        label: 소개 문장 (검은 섹션)
        type: object
        fields:
          - { name: headline, label: 큰 문장, type: text }
          - { name: body, label: 설명 문단, type: text }
          - { name: pillars, label: 작은 키워드 (줄바꿈 가능), type: text }
      - name: cta
        label: 문의 유도 문구
        type: object
        fields:
          - { name: question, label: 질문, type: string }
          - { name: button, label: 큰 버튼 글자, type: string }
      - name: what
        label: 우리가 하는 일
        type: object
        fields:
          - { name: title_light, label: 제목 (얇은 글씨), type: string }
          - { name: title_bold, label: 제목 (굵은 글씨), type: string }
          - { name: intro, label: 설명, type: text }
          - name: columns
            label: 서비스 목록 (4열)
            type: object
            list: true
            fields:
              - { name: items, label: 항목, type: string, list: true }
      - name: approach
        label: 일하는 방식
        type: object
        fields:
          - { name: label, label: 섹션 라벨, type: string }
          - name: rows
            label: 단계
            type: object
            list: true
            fields:
              - { name: title, label: 제목, type: string }
              - { name: desc, label: 마우스 올리면 보이는 설명, type: text }
      - name: featured
        label: 새로운 작업 (대표 작품 1개)
        type: object
        fields:
          - { name: title_light, label: 제목 (얇은 글씨), type: string }
          - { name: title_bold, label: 제목 (굵은 글씨), type: string }
          - { name: desc, label: 설명, type: text }
          - { name: caption, label: 영상 아래 캡션, type: string }
          - { name: video, label: 영상 (mp4), type: file }
          - { name: poster, label: 썸네일 이미지, type: image }
      - name: cases
        label: 주요 작업 (포트폴리오)
        type: object
        fields:
          - { name: heading, label: 섹션 제목, type: string }
          - name: items
            label: 작품 (위에서부터 순서대로 표시)
            type: object
            list: true
            fields:
              - { name: client, label: 클라이언트, type: string }
              - { name: title, label: 작품명, type: string }
              - name: category
                label: 분류 (필터)
                type: select
                options:
                  values: [캠페인, 숏폼, 필름·뮤직비디오, 옥외·미디어아트]
              - { name: vertical, label: 세로형 영상이면 체크, type: boolean }
              - { name: video, label: 미리보기 영상 (짧은 루프 mp4), type: file }
              - { name: poster, label: 썸네일 이미지, type: image }
      - name: vision
        label: 핵심 가치
        type: object
        fields:
          - { name: heading, label: 큰 제목, type: string }
          - { name: image, label: 배경 이미지, type: image }
          - { name: lede, label: 대표 문장, type: text }
          - name: points
            label: 가치 3가지
            type: object
            list: true
            fields:
              - { name: title, label: 제목, type: string }
              - { name: body, label: 설명, type: text }
          - { name: closing, label: 마무리 문장, type: text }
      - name: steps
        label: 9단계 프로세스
        type: object
        fields:
          - { name: title_1, label: 제목 1줄, type: string }
          - { name: title_2, label: 제목 2줄 (얇은 글씨), type: string }
          - { name: title_3, label: 제목 3줄, type: string }
          - { name: intro, label: 설명, type: text }
          - name: items
            label: 단계
            type: object
            list: true
            fields:
              - { name: phase, label: 페이즈, type: string }
              - { name: name, label: 단계명, type: string }
              - { name: desc, label: 하는 일, type: text }
              - { name: output, label: 산출물, type: string }
      - name: clients
        label: 클라이언트
        type: object
        fields:
          - { name: heading, label: 제목, type: string }
          - { name: sub, label: 부제 (얇은 글씨), type: string }
          - name: categories
            label: 분야
            type: object
            list: true
            fields:
              - { name: name, label: 분야명, type: string }
              - { name: count, label: 개수, type: string }
          - { name: names, label: 클라이언트 이름, type: string, list: true }
      - name: footer
        label: 하단 정보
        type: object
        fields:
          - { name: address, label: 주소 (줄바꿈 가능), type: text }
          - { name: social, label: 소셜 (줄바꿈 가능), type: text }
          - { name: deck_button, label: 소개서 버튼 문구, type: string }
          - { name: tagline, label: 맨 아래 문구, type: string }
